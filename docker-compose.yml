services:
  sentinel-ai:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel-ai:latest
    container_name: sentinel-ai
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped

volumes:
  sentinel-data:
